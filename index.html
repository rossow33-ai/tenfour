<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tenfour</title><meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="tenfour">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png">
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 48px) 20px 40px}
h1{font-weight:600;font-size:40px;letter-spacing:-1px;margin:0 0 36px;text-align:center}
a{display:flex;align-items:center;gap:18px;padding:20px;margin-bottom:16px;border:1px solid #333;border-radius:20px;color:#fff;text-decoration:none;background:#0d0d0d}
a:active{background:#1a1a1a}img{width:64px;height:64px;border-radius:14px}b{font-size:22px;font-weight:600;display:block}span{color:#888;font-size:15px}</style></head><body>
<h1>tenfour</h1>
<div id="apps"></div>
<script>
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('apps.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{document.getElementById('apps').innerHTML=a.map(x=>`<a href="${esc(x.url)}"><img src="${esc(x.icon)}" alt=""><div><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></div></a>`).join('')});
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update())}
</script></body></html>
